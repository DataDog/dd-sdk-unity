[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-sdk-unity"
version = "0.1.0"
description = "Development and test tooling for the Datadog Unity SDK"
requires-python = ">=3.14,<3.15"
dependencies = [
    "GitPython==3.1.62",
    "PyGithub==2.5.0",
    "saxonche==13.0.0",
    "requests==2.33.1",
    "junitparser==3.2.0",
    "pydantic==2.13.4",
    "psutil==7.2.2",
    "flask==3.1.3",
    "flask-cors==6.0.1",
    "jsonschema==4.17.3",
    "pytest==9.1.1",
]

[project.scripts]
dd-unity-build-demo = "dd_sdk_unity.scripts.build_demo:main"
dd-unity-generate-notice-file = "dd_sdk_unity.scripts.generate_notice_file:main"
dd-unity-install-unity = "dd_sdk_unity.scripts.install_unity:main"
dd-unity-integration-test = "dd_sdk_unity.scripts.integration_test:main"
dd-unity-integration-test-setup = "dd_sdk_unity.scripts.integration_test_setup:main"
dd-unity-ios-xcframework = "dd_sdk_unity.scripts.ios_xcframework:main"
dd-unity-prepare-release = "dd_sdk_unity.scripts.prepare_release:main"
dd-unity-start-simulator = "dd_sdk_unity.scripts.start_simulator:main"
dd-unity-unit-test = "dd_sdk_unity.scripts.unit_test:main"
dd-unity-update-android-version = "dd_sdk_unity.scripts.update_android_version:main"
dd-unity-update-ios-version = "dd_sdk_unity.scripts.update_ios_version:main"
dd-unity-verify-ios-build = "dd_sdk_unity.scripts.verify_ios_build:cli_main"

[tool.setuptools]
packages = ["dd_sdk_unity"]
package-dir = {"" = "tools"}

[tool.pytest.ini_options]
testpaths = ["tools/dd_sdk_unity/scripts"]
