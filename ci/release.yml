.release-job:
  image: "$LINUX_IMAGE"
  tags: ["arch:amd64"]
  variables:
    GIT_DEPTH: "0"
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  before_script:
    - !reference [.shared, init-scripts]
  after_script:
    - source ci/release-auth.sh revoke

prepare-release:
  extends: .release-job
  stage: release-prepare
  needs: []
  interruptible: false
  when: manual
  allow_failure: true
  variables:
    BASE_VERSION: ''
    RELEASE_VERSION: ''
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  script:
    - source ci/release-auth.sh dd-sdk-unity
    - export AI_GATEWAY_TOKEN="$(authanywhere --audience rapid-ai-platform --raw --dc us1.ddbuild.io)"
    - >
      dd-unity-release prepare
      ${BASE_VERSION:+--base-version="$BASE_VERSION"}
      ${RELEASE_VERSION:+--release-version="$RELEASE_VERSION"}

publish-release:
  extends: .release-job
  stage: release-publish
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: false
  needs:
    - job: assemble-package
      artifacts: true
  script:
    # Keep publication in dry-run mode until CI testing is complete.
    - source ci/release-auth.sh dd-sdk-unity
    - source ci/release-auth.sh unity-package
    - dd-unity-release publish --dry-run

integrate-release:
  extends: .release-job
  stage: release-integrate
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: publish-release
      artifacts: false
  script:
    # Keep integration in dry-run mode until CI testing is complete.
    - source ci/release-auth.sh dd-sdk-unity
    - dd-unity-release integrate --dry-run
