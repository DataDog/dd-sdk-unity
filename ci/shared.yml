.shared:
  init-scripts:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - python -m pip install --editable .
  install-unity:
    # Install Unity CLI and other development dependencies
    - brew install --cask unity-cli
    - unity --version
    - brew install xcbeautify
    - dd-unity-install-unity "$UNITY_VERSION_PARTIAL"
  install-unity-linux:
    - unity --version
    - dd-unity-install-unity "$UNITY_VERSION_PARTIAL" --modules android

.needs-unity-license:
  before_script:
    # Grab the Unity Licensing Server configuration and write it to the system-wide
    # Unity config dir so that the Unity Licensing Client installed alongside our
    # version of Unity knows how to obtain floating licenses
    - |
      if [ "$(uname -s)" = Linux ]; then
        UNITY_SERVER_CONFIG=$(vault kv get -field=config kv/k8s/gitlab-runner/dd-sdk-unity/server-config)
      else
        if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
          aws_env="$(aws configure export-credentials --format env)"
          eval "$aws_env"
        fi
        vault login -method=aws -no-print
        UNITY_SERVER_CONFIG=$(vault kv get -field=config kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-unity/server-config)
      fi
    - export UNITY_SERVER_CONFIG
    - |
      if [ "$(uname -s)" = Linux ]; then
        mkdir -p "$UNITY_SUPPORT_PATH"
        printf "%s\n" "$UNITY_SERVER_CONFIG" > "$UNITY_SUPPORT_PATH/services-config.json"
        chmod -R +r "$UNITY_SUPPORT_PATH"
      else
        sudo mkdir -p "$UNITY_SUPPORT_PATH"
        printf "%s\n" "$UNITY_SERVER_CONFIG" | sudo tee "$UNITY_SUPPORT_PATH/services-config.json" >/dev/null
        sudo chmod -R +r "$UNITY_SUPPORT_PATH"
      fi
    - ls -la "$UNITY_SUPPORT_PATH"
  after_script:
    - unity license return --yes || true
