# Install as .github/chainguard/dd-sdk-unity.release.sts.yaml in unity-package.
# This file is a deployment input, not an active policy in dd-sdk-unity.
issuer: https://gitlab.ddbuild.io
subject_pattern: 'project_path:DataDog/dd-sdk-unity:ref_type:branch:ref:release-prep/[0-9]+\.[0-9]+\.[0-9]+'
claim_pattern:
  project_path: 'DataDog/dd-sdk-unity'
  ref_type: 'branch'
  ref_path: 'refs/heads/release-prep/[0-9]+\.[0-9]+\.[0-9]+'
  ci_config_ref_uri: 'gitlab\.ddbuild\.io/DataDog/dd-sdk-unity//\.gitlab-ci\.yml@refs/heads/release-prep/[0-9]+\.[0-9]+\.[0-9]+'
  pipeline_source: '(push|web)'
permissions:
  contents: write
