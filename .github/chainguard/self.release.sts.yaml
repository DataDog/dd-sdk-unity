# Maintainer-run preparation/publication on this project's selected branch revision.
issuer: https://gitlab.ddbuild.io
subject_pattern: 'project_path:DataDog/dd-sdk-unity:ref_type:branch:ref:.+'
claim_pattern:
  project_path: 'DataDog/dd-sdk-unity'
  ref_type: 'branch'
  ref_path: 'refs/heads/.+'
  ci_config_ref_uri: 'gitlab\.ddbuild\.io/DataDog/dd-sdk-unity//\.gitlab-ci\.yml@refs/heads/.+'
  pipeline_source: '(push|web)'
permissions:
  contents: write
  pull_requests: write
