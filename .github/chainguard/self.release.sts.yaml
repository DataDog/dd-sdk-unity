# Policy for release prep, publication, and integration.
issuer: https://gitlab.ddbuild.io
subject_pattern: 'project_path:DataDog/dd-sdk-unity:ref_type:branch:ref:(develop|release/\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)'
claim_pattern:
  ci_config_ref_uri: 'gitlab\.ddbuild\.io/DataDog/dd-sdk-unity//\.gitlab-ci\.yml@refs/heads/(develop|release/\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)'
  pipeline_source: 'push'
  project_path: 'DataDog/dd-sdk-unity'
  ref: '^(develop|release/\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$'
  ref_path: '^refs/heads/(develop|release/\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$'
  ref_type: 'branch'
permissions:
  contents: write
  pull_requests: write
