integration-test-android:
  stage: integration-test
  tags:
    - macos:sonoma
    - specific:true
  script:
    - !reference [.shared, install-dependencies]
    - !reference [.shared, create-server-config]
    - !reference [.shared, install-dart]
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
    - cd $CI_PROJECT_DIR/tools/mock_server
    - python3 -m venv venv && ./venv/bin/pip3 install -r requirements.txt
    - ./venv/bin/python3 app.py --update-schemas
    - cd $CI_PROJECT_DIR/tools/dart/ci
    - dart pub get && dart run ci_helpers start_sim --platform android --sdk "33"
    - cd $CI_PROJECT_DIR/tools/scripts
    - python3 -m venv venv && ./venv/bin/pip3 install -r requirements.txt
    - ./venv/bin/python3 ./run_integration_test.py --platform android
  after_script:
    - git --no-pager diff
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/samples/Datadog Sample/tmp/*-junit-results.xml
    paths:
      - $CI_PROJECT_DIR/tools/scripts/unity_log.log

integration-test-ios:
  stage: integration-test
  tags:
    - macos:sonoma
    - specific:true
  script:
    - !reference [.shared, install-dependencies]
    - !reference [.shared, create-server-config]
    - !reference [.shared, install-dart]
    - xcode-select --print-path
    - xcrun simctl shutdown all
    - killall Xcode || true
    - cd $CI_PROJECT_DIR/tools/mock_server
    - python3 -m venv venv && ./venv/bin/pip3 install -r requirements.txt
    - ./venv/bin/python3 app.py --update-schemas
    - cd $CI_PROJECT_DIR/tools/scripts
    - python3 -m venv venv && ./venv/bin/pip3 install -r requirements.txt
    - ./venv/bin/python3 ./run_integration_test.py --platform ios --launch-simulator || true
    - ls $CI_PROJECT_DIR/samples
    - ls $CI_PROJECT_DIR/samples/Datadog\ Sample
    - ls $CI_PROJECT_DIR/samples/Datadog\ Sample/Temp
    - export UNITY_TEST_DIR=`ls -Art $CI_PROJECT_DIR/samples/Datadog\ Sample/Temp | tail -n 1`
    - cd $CI_PROJECT_DIR/samples/Datadog\ Sample/Temp/$UNITY_TEST_DIR/PlayerWithTests
    - xcodebuild
  after_script:
    - mkdir .artifacts
    - export LAST_XCODE_BUILD_DIR=`ls -Art $HOME/Library/Developer/Xcode/DerivedData | tail -n 1`
    - export IOS_SIMULATOR_UUID=`cat $CI_PROJECT_DIR/tools/scripts/.ios_simulator_uuid`
    - ls -la $HOME/Library/Developer/Xcode/DerivedData/
    - ls -la $HOME/Library/Developer/Xcode/DerivedData/$LAST_XCODE_BUILD_DIR
    - ls -la $HOME/Library/Developer/Xcode/DerivedData/$LAST_XCODE_BUILD_DIR/Logs
    - ls -la $HOME/Library/Developer/Xcode/DerivedData/$LAST_XCODE_BUILD_DIR/Logs/Build
    - cp $HOME/Library/Developer/Xcode/DerivedData/$LAST_XCODE_BUILD_DIR/Logs/Build/*.xcactivitylog .artifacts || true
    - cp $HOME/Library/Logs/CoreSimulator/$IOS_SIMULATOR_UUID/system.log .artifacts || true
    - git --no-pager diff
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/samples/Datadog Sample/tmp/*-junit-results.xml
    paths:
      - $CI_PROJECT_DIR/.artifacts/*
      - $CI_PROJECT_DIR/tools/scripts/unity_log.log
