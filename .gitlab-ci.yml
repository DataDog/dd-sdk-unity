# RUM-5994: temporarily run only iOS simulator integration tests while validating CI.
# include:
#   - 'https://gitlab-templates.ddbuild.io/slack-notifier/v3-sdm/template.yml'

variables:
  UNITY_VERSION_PARTIAL: 2022.3
  UNITY_SUPPORT_PATH: "/Library/Application Support/Unity/config"

stages:
  - unit-test
  - integration-test
  - package
  - post

.shared:
  init-scripts:
    # Running with no arguments will ensure our Python venv is initialized
    - ./run-script
  install-unity:
    # Install Unity CLI and other development dependencies
    - brew install --cask unity-cli
    - unity --version
    - brew install xcbeautify
    # Run install_unity.py to ensure that our requisite version of Unity is installed:
    # the last line of output will contain the full version string, so export it as
    # UNITY_VERSION
    - LOG_TMPFILE=$(mktemp)
    - ./run-script install_unity "$UNITY_VERSION_PARTIAL" | tee "$LOG_TMPFILE"
    - export UNITY_VERSION=$(tail -n 1 "$LOG_TMPFILE")
    - rm "$LOG_TMPFILE"
    - echo "Using Unity version $UNITY_VERSION"
  configure-unity-licensing:
    # Grab the Unity Licensing Server configuration and write it to the system-wide
    # Unity config dir so that the Unity Licensing Client installed alongside our
    # version of Unity knows how to obtain floating licenses
    - |
      if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        aws_env="$(aws configure export-credentials --format env)"
        eval "$aws_env"
      fi
    - vault login -method=aws -no-print
    - export UNITY_SERVER_CONFIG=$(vault kv get -field=config kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-unity/server-config)
    - echo $UNITY_SERVER_CONFIG
    - sudo mkdir -p "$UNITY_SUPPORT_PATH"
    - printf "%s\n" "$UNITY_SERVER_CONFIG" | sudo tee "$UNITY_SUPPORT_PATH/services-config.json"
    - sudo chmod -R +r "$UNITY_SUPPORT_PATH"
    - ls -la "$UNITY_SUPPORT_PATH"

.unit-test:
  stage: unit-test
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:dd-sdk-unity-sequoia-latest
  tags:
    - macos:tart
  parallel:
    matrix:
      - UNITY_VERSION_PARTIAL: '2021.3'
        PROJECT_PATH: 'test_scaffolds/2021 LTS'
      - UNITY_VERSION_PARTIAL: '2022.3'
        PROJECT_PATH: 'samples/Datadog Sample'
      - UNITY_VERSION_PARTIAL: '6000.2'
        PROJECT_PATH: 'test_scaffolds/6000 LTS'
  script:
    - !reference [.shared, init-scripts]
    - !reference [.shared, install-unity]
    - !reference [.shared, configure-unity-licensing]
    - ./run-script unit_test --unity-version "$UNITY_VERSION" --project "$PROJECT_PATH"
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: unit-test*.xml
  retry:
    max: 2
    exit_codes:
      # Retry Unity CLI operation failures (6) and unavailable services (7).
      - 6
      - 7

integration-test-ios:
  stage: integration-test
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:dd-sdk-unity-sequoia-latest
  tags:
    - macos:tart
  timeout: 1h
  # Add 2021.3 and 6000.2 once their projects have the integration-test prerequisites.
  variables:
    # Reserve time for cleanup and diagnostic artifact upload before the 1h job limit.
    RUNNER_SCRIPT_TIMEOUT: 20m
    UNITY_VERSION_PARTIAL: '2022.3'
    PROJECT_PATH: 'samples/Datadog Sample'
  script:
    - !reference [.shared, init-scripts]
    - !reference [.shared, install-unity]
    - |
      set -o pipefail
      (
        set -e
        printf 'Preparing Xcode: job user=%s, console user=%s\n' "$(id -un)" "$(stat -f '%Su' /dev/console)"
        xcode-select -p
        xcodebuild -version
        if xcodebuild -checkFirstLaunchStatus; then
          echo 'Xcode first-launch tasks are already complete'
        else
          echo 'Xcode first-launch tasks need preparation'
        fi
        xcrun simctl list runtimes available
        sudo xcodebuild -license accept
        sudo xcodebuild -runFirstLaunch
        sudo mkdir -p /Library/Developer/CoreSimulator/Images/Inbox /Library/Developer/CoreSimulator/Images/mnt
        xcrun simctl list devices >/dev/null 2>&1 || true
        # Match AMI registration using the installed runtime's internal build ID.
        task_runtime_build=$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; builds = [r.get("buildversion") for r in runtimes if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and r.get("buildversion")]; sys.exit("No available iOS runtime build for registration") if not builds else print(builds[0])')
        if [ "$(uname -m)" = arm64 ]; then
          task_architecture=arm64
        else
          task_architecture=universal
        fi
        printf 'Registering iOS runtime build %s, architecture %s\n' "$task_runtime_build" "$task_architecture"
        # Run as the job/GUI user, retaining the AMI's already-downloaded fallback.
        if task_download_output=$(xcodebuild -downloadPlatform iOS -buildVersion "$task_runtime_build" -architectureVariant "$task_architecture" 2>&1); then
          printf '%s\n' "$task_download_output"
        else
          printf '%s\n' "$task_download_output"
          [[ "$task_download_output" == *"already downloaded"* ]] || exit 1
        fi
        xcodebuild -checkFirstLaunchStatus
        xcrun simctl list runtimes available
        xcrun simctl list runtimes -j | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; sys.exit(0 if any(r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for r in runtimes) else "No available iOS Simulator runtime after Xcode preparation")'
        xcrun simctl list devices available
      ) 2>&1 | tee integration-test-ios-xcode-setup.log
    - !reference [.shared, configure-unity-licensing]
    - ./run-script ios_xcframework stage
    - ./run-script integration_test --platform ios --target simulator --unity-version "$UNITY_VERSION" --project "$PROJECT_PATH"
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: integration-test-ios.xml
    paths:
      - integration-test-ios*.log
      - integration-test-ios-diagnostics/
      - "$PROJECT_PATH/Library/Bee/**/*.traceevents"
      - "$PROJECT_PATH/Logs/AssetImportWorker*.log"
      - nunit-integration-test-ios.xml
      - "$PROJECT_PATH/Library/DatadogIntegrationTests/mock-server.log"

.package-ios:
  stage: package
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:dd-sdk-unity-sequoia-latest
  tags:
    - macos:tart
  script:
    - !reference [.shared, init-scripts]
    - !reference [.shared, install-unity]
    - !reference [.shared, configure-unity-licensing]
    - export DEMO_CLIENT_TOKEN=$(vault kv get -field=value kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-unity/demo_client_token)
    - export DEMO_APPLICATION_ID=$(vault kv get -field=value kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-unity/demo_application_id)
    - cd $CI_PROJECT_DIR/tools/scripts
    - ./setup_demo_signing.sh
    - cd $CI_PROJECT_DIR
    - ./run-script build_demo --platform ios --client-token $DEMO_CLIENT_TOKEN --application-id $DEMO_APPLICATION_ID
  artifacts:
    when: on_success
    expire_in: "30 days"
    paths:
      - samples/Demo Data/Build/iOS/export/*
  retry:
    max: 2
    exit_codes:
      # Retry Unity CLI operation failures (6) and unavailable services (7).
      - 6
      - 7

.package-android:
  stage: package
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:dd-sdk-unity-sequoia-latest
  tags:
    - macos:tart
  script:
    - !reference [.shared, init-scripts]
    - !reference [.shared, install-unity]
    - !reference [.shared, configure-unity-licensing]
    - export DEMO_CLIENT_TOKEN=$(vault kv get -field=value kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-unity/demo_client_token)
    - export DEMO_APPLICATION_ID=$(vault kv get -field=value kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-unity/demo_application_id)
    - ./run-script build_demo --platform android --client-token $DEMO_CLIENT_TOKEN --application-id $DEMO_APPLICATION_ID
  artifacts:
    when: on_success
    expire_in: "30 days"
    paths:
      - samples/Demo Data/Build/Android/datadog-demo.apk
  retry:
    max: 2
    exit_codes:
      # Retry Unity CLI operation failures (6) and unavailable services (7).
      - 6
      - 7

.notify-pipeline-succeeded:
  stage: post
  tags: [ "arch:amd64" ]
  image: "$BUILDENV_REGISTRY/images/docker:24.0.4-gbi-focal"
  when: on_success
  except:
    - schedules
    - develop
  script:
    - echo "Pipeline did succeed"
