include:
  - 'https://gitlab-templates.ddbuild.io/slack-notifier/v3-sdm/template.yml'
  - local: ci/shared.yml
  - local: ci/build-image.yml
  - local: ci/test.yml
  - local: ci/package.yml
  - local: ci/release.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      auto_cancel:
        on_new_commit: none
    - when: always

default:
  interruptible: true

variables:
  CURRENT_CI_IMAGE: "1"
  LINUX_IMAGE: registry.ddbuild.io/ci/dd-sdk-unity:$CURRENT_CI_IMAGE
  MAC_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:dd-sdk-unity-sequoia-latest
  DEPOT_GITHUB_RELEASES_BASE: https://depot-read-api-github-releases.us1.ddbuild.io/internal/mirror/github-releases
  UNITY_NON_INTERACTIVE: "1"
  UNITY_VERSION_PARTIAL: 2022.3
  UNITY_SUPPORT_PATH: "/Library/Application Support/Unity/config"

stages:
  - ci-image
  - unit-test
  - integration-test
  - package
  - release-prepare
  - release-publish
  - release-integrate
  - post

notify-pipeline-succeeded:
  stage: post
  tags: [ "arch:amd64" ]
  image: "$BUILDENV_REGISTRY/images/docker:24.0.4-gbi-focal"
  when: on_success
  except:
    - schedules
    - develop
  script:
    - echo "Pipeline did succeed"
